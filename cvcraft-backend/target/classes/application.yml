spring:
  application:
    name: cvcraft-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cvcraft_db}?sslmode=${PGSSLMODE:prefer}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:135790}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:cvcraft_super_secret_key_2024_must_be_256_bits_long_for_security}
  expiration: 86400000       # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  upload:
    cv-dir: ./uploads/cvs
    avatar-dir: ./uploads/avatars
    max-size-mb: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: CVCraft API
    version: 1.0.0
    description: REST API for CVCraft - Professional CV Browsing & Recruitment Platform

logging:
  level:
    com.cvcraft: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
